apiVersion: v1
kind: Pod 
metadata:
  name: sa-demo 
  namespace: expense
spec:
  ServiceAccount: expense-mysql-secret
  initContainers:
  - name: awscli
    image: amazon/aws-cli
    command: ['sh', '-c', 'aws secretsmanager get-secret-value --secret-id expense/mySQL/creds --query SecretString --output text > /secret/.env ']
    volumeMounts:
    - mountPath: /secret
      name: secret-volume
  # one pod contain multiple containers
  containers:
  - name: nginx
    image: nginx
    volumeMounts:
    - mountPath: /secret
      name: secret-volume
  volumes:
  - name: secret-volume
    emptyDir: {}